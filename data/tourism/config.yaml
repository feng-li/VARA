    var1_autoets_ann_rmse: 253.1928451996644

autoets_family_vara_o_selection:
  purpose: find a parsimonious AutoETS family for which unit-weight VARA improves RMSE
  direct_screen_entrypoint: scripts/screen_tourism_autoets_families.py
  vara_runner_entrypoint: scripts/run_tourism_autoets_family_vara.py
  selection_entrypoint: scripts/select_tourism_autoets_family_vara.py
  forecast_root: outputs/tourism_autoets_family_full
  vara_root: outputs/tourism_vara_autoets_family
  output_dir: outputs/tourism_autoets_family_vara_selection
  selection_uses_final_2016: false
  validation_windows:
    - {months: 36, start: "2013-01-01", end: "2015-12-01"}
    - {months: 24, start: "2014-01-01", end: "2015-12-01"}
    - {months: 12, start: "2015-01-01", end: "2015-12-01"}
  selection_rule:
    - direct 36-month validation RMSE no worse than standard ZZZ
    - unit-weight VARA improves RMSE over direct AutoETS in the last 24 validation months
    - unit-weight VARA improves RMSE over direct AutoETS in the last 12 validation months
    - prefer the eligible family with the most automatically selected ETS components
    - break remaining ties by 24-month unit-weight validation RMSE
  selected_candidate_id: zza_add_season_auto
  selected_model_config:
    implementation: statsforecast.models.AutoETS
    package_version: 2.0.3
    model_specification: ZZA
    interpretation: automatic error, automatic trend/damping, additive seasonality
    season_length: 12
    damped: null
    phi: null
    selection_criterion: AICc
    optimization_criterion: likelihood
    allow_multiplicative_trend: false
    series_fit: separate
    training_window: expanding
    forecast_horizon: 1
    refit_every_origin: true
    clip_nonnegative: true
  vara_strategy_id: predictive_avg_topk10_w24_stable05
  vara_correction_weight: 1.0
  final_2016_result:
    evaluation_scale: original visitor nights
    n_origins: 12
    n_series: 76
    autoets_rmse: 119.7047475096557
    vara_autoets_o_rmse: 119.41130224746364
    rmse_gain: 0.29344526219206557
    rmse_gain_pct: 0.24514087226857523

autoets_zza_table6:
  purpose: full 11-method Table 6 with training-only z-score normalization and ZZA used in every AutoETS-based method
  selection_source: autoets_family_vara_o_selection
  selection_uses_final_2016: false
  autoets_entrypoint: scripts/evaluate_tourism_76_autoets.py
  autoets_output_path: outputs/tourism_76_autoets_zza_train_zscore_extended/rolling_forecasts.csv
  autoets_first_year: 2000
  autoets_final_year: 2016
  vara_entrypoint: scripts/search_tourism_oos_error_vara.py
  vara_output_dir: outputs/tourism_76_vara_zza_train_zscore_w24
  combination_entrypoint: scripts/recombine_tourism_76_reliability_vara.py
  combination_output_dir: outputs/tourism_76_reliability_vara_autoets_zza_train_zscore
  benchmark_entrypoint: scripts/run_benchmarks.py
  benchmark_output_dir: outputs/tourism_benchmark_zza_train_zscore_run/rolling-origin
  table6_entrypoint: scripts/build_tourism_table6_zza.py
  table6_output_dir: outputs/tourism_table6_zza_train_zscore
  model_config:
    implementation: statsforecast.models.AutoETS
    package_version: 2.0.3
    model_specification: ZZA
    interpretation: automatic error, automatic trend/damping, additive seasonality
    season_length: 12
    damped: null
    phi: null
    selection_criterion: AICc
    optimization_criterion: likelihood
    response_transform: none
    response_normalization: training_zscore
    normalization_scope: per rolling origin and per series
    normalization_statistics_source: observations through the month before the forecast target
    normalization_variance_ddof: 0
    normalization_formula: (response - training_mean) / sqrt(training_variance)
    forecast_inverse_formula: training_mean + sqrt(training_variance) * normalized_forecast
    training_window: expanding
    forecast_horizon: 1
    refit_every_origin: true
    clip_nonnegative: true
  vara_strategy_id: predictive_avg_topk10_w24_stable05
  calibrated_vara:
    selection_period: ["2013-01-01", "2015-12-01"]
    final_period: ["2016-01-01", "2016-12-01"]
    state_window_months: 36
    state_feature_set: vara_seasonal10
    state_ridge_alpha: 10.0
    calibration_window_months: 36
    calibration_min_months: 24
    final_forecasts_use_full_calibration_window: true
    lambda_prior_strength: 3.0
    lambda_cap: 1.25
  result:
    method_count: 11
    rank_score_metric: monthly cross-series mean absolute error
    rank_score_definition: average over s=217,...,228 of 100 times strict pairwise absolute-error wins divided by 10 comparators
    best_method: VARA--AutoETS(ZZA)_lambda
    best_rmse: 116.40055199152688
    best_rank_score: 75.83333333333333
    autoets_zza_rank_score: 75.83333333333333
    autoets_zza_rmse: 118.458906939579
    ar1_autoets_zza_rank_score: 74.16666666666667
    ar1_autoets_zza_rmse: 118.62158223629494
    unit_vara_autoets_zza_rank_score: 60.833333333333336
    unit_vara_autoets_zza_rmse: 118.52109252591556
    var1_autoets_zza_rank_score: 23.333333333333332
    var1_autoets_zza_rmse: 145.17958969438905

vara_oos_error_forecasts:
  entrypoint: scripts/search_tourism_oos_error_vara.py
  forecast_panel_path: outputs/tourism_76_autoets_extended/rolling_forecasts.csv
  output_dir: outputs/tourism_76_vara_extended
  validation_start: "2001-01-01"
  validation_end: "2016-12-01"
  selection_end: "2015-12-01"
  skip_scoring: true
  strategy:
    strategy_id: predictive_avg_topk10_w24_stable05
    feature_source: predictive-average
    predictive_score_lags: [1, 12]
    predictive_score_combination: equal_average
    aligned_target_source_standardization: separate
    directed_score_matrix: true
    mask_self_links: true
    attention_mode: score-topk
    attention_top_k: 10
    neighbor_selection_score: eta_times_predictive_score
    attention_normalization: row_softmax
    transform: standardize
    history_window: 24
    ridge: 0.01
    grid_size: 7
    eta_bounds: [-2.0, 2.0]
    eta_refinement: golden_section_within_best_grid_interval
    stability_cap: 0.5

