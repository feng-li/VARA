# Frozen Tourism application configuration for docs/VAR_Atten.tex.
# Paths are relative to the repository root. Runtime CPU counts may be reduced
# without changing the statistical specification.
schema_version: 1
status: frozen
paper_source: docs/VAR_Atten.tex
application_name: Australian Tourism
response: monthly all-purpose visitor nights for 76 depth-three geographies
data_path: data/tourism/tourism.csv
purpose_component_series_used: false

autoets_oos_forecasts:
  entrypoint: scripts/evaluate_tourism_76_autoets.py
  data_path: data/tourism/tourism.csv
  output_path: outputs/tourism_76_autoets_extended/rolling_forecasts.csv
  first_year: 1999
  final_year: 2016
  series_depth: 3
  expected_n_series: 76
  season_length: 12
  response_transform: none
  clip_nonnegative: true
  model_config: &tourism_autoets_model_config
    implementation: statsforecast.models.AutoETS
    package_version: 2.0.3
    model_specification: ZZZ
    damped: null
    phi: null
    selection_criterion: AICc
    optimization_criterion: likelihood
    allow_multiplicative_trend: false
    series_fit: separate
    training_window: expanding
    forecast_horizon: 1
    refit_every_origin: true
    validation_hyperparameter_search: false

autoets_ann_sensitivity:
