    method: training_zscore
    scope: per origin and per series
    statistics_source: observations through the month before the forecast target
    variance_ddof: 0
    fit_formula: (response - training_mean) / sqrt(training_variance)
    forecast_inverse_formula: training_mean + sqrt(training_variance) * normalized_forecast
    constant_series_scale_fallback: 1.0
  autoets_model_specification: ZZA
  autoets_training_window: expanding
  vara_strategy_id: predictive_avg_topk10_w24_stable05
  vara_history_window_months: 24
  level:
    response_transform: none
    autoets_output_path: outputs/tourism_76_autoets_zza_train_zscore_extended/rolling_forecasts.csv
