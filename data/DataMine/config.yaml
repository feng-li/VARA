# Frozen Accounting-Signal Risk application configuration for
# docs/VAR_Atten.tex. Paths are relative to the repository root.
schema_version: 2
status: frozen_paper_eta_results
application_contract_schema: datamine_vara_paper_eta_v2
paper_source: docs/VAR_Atten.tex
application_name: Accounting-Signal Risk
response: next-month log squared long-short portfolio return

# The core routines consume the effective slope multiplying the similarity
# score. The application runners expose the paper parameter eta and apply the
# high-dimensional score scale log(p) at their boundary, so the core remains
# unchanged.
attention_parameterization:
  name: paper_eta_log_component_count_v1
  paper_parameter: eta
  paper_weight_formula: exp(eta * log(component_count) * score)
  component_count: 21800
  score_scale_rule: log_component_count
  score_scale_value: 9.98966524877718
  paper_eta_bounds: [-2.0, 2.0]
  effective_slope_bounds: [-19.97933049755436, 19.97933049755436]
  eta_grid_size: 7
  paper_eta_local_tolerance: 0.0001
  effective_slope_local_tolerance: 0.0009989665248777181
  estimator: ridge_penalized_concentrated_qmle
  support: deterministic_fixed_smallest_scores
  support_size: 500

# This workflow supplies the frozen panel, HAR baseline, benchmarks, and the
# December 2007 formula-feature snapshot consumed by the paper model.
source_workflow:
  entrypoint: scripts/run_datamine_workflow.py
  stage: run
  executable_config: data/DataMine/full_quality_formula_topk500_exact.yml
  output_dir: outputs/datamine_vara/ew_log_risk_full_formula_topk500_exact_lambda24
  data_dir: data/DataMine
  return_file: DataMinedLongShortReturnsEW.parquet
  metadata_file: DataMinedSignalList.parquet
  weighting: ew
  return_unit: percent
  max_series: 0
  seed: 202407
  series_selection_mode: quality_persistence
  universe_window_months: 240
  min_observed_fraction: 0.99
  min_median_nstock: 10
  min_nstock: 5
  min_nstock_fraction: 0.99
  max_missing_run: 1
  validation_months: 60
  test_months: 120
  target_type: log_squared_return
  epsilon: 1.0e-6
  minimum_baseline_observations: 120
  baseline_ridge_candidates: [1.0]
  benchmark_ar1_ridge_candidates: [1.0]
  garch_alpha_candidates: [0.03, 0.05, 0.08, 0.12, 0.18, 0.25]
  garch_beta_candidates: [0.50, 0.65, 0.75, 0.85, 0.90, 0.94]
  feature_set: formula
  formula_encoding: svd
  formula_svd_dim: 16
  formula_svd_drop_components: 0
  formula_type_columns_retained: 2
  row_normalize_features: true
  rank_score_components:
    - log_risk_rmse
    - log_risk_mae
    - gaussian_return_crps
    - absolute_log_risk_bias
  rank_score_comparison_methods:
    - har_vara
    - baseline
    - ar1
    - garch11
  rank_score_tie_method: average

# This is the model reported in Tables 8 and 9. For a clean run, omit
# --reuse-saved-correction; that flag in the saved contract only avoided
# recomputing an already completed correction during final metric generation.
final_har_vara:
  entrypoint: scripts/run_datamine_har_vara.py
  source_output: outputs/datamine_vara/ew_log_risk_full_formula_topk500_exact_lambda24
  output_dir: outputs/datamine_vara/ew_log_risk_har_vara_papereta_logp_topk500_w240_refit12_lambda24
  feature_snapshot: snapshot_200712
  component_count: 21800
  feature_count: 18
  har_windows: [1, 3, 12]
  error_window_months: 240
  refit_frequency_months: 12
  response_standardization: componentwise_median_mad
  response_clip: 8.0
  ridge: 0.001
  attention_mode: topk
  attention_top_k: 500
  attention_cache_mode: exact
  attention_batch_size: 512
  parallel_backend: ray
  ray_num_cpus: 15
  max_cpus_per_task: 1
  ray_task_unit: rolling_refit_block
  ray_debug: false
  eta_estimation: ridge_penalized_concentrated_qmle
  eta_parameterization: paper_eta_log_component_count_v1
  eta_score_scale_rule: log_component_count
  eta_score_scale_value: 9.98966524877718
  eta_bounds: [-2.0, 2.0]
  eta_effective_slope_bounds: [-19.97933049755436, 19.97933049755436]
  eta_grid_size: 7
  eta_local_tolerance: 0.0001
  eta_effective_slope_local_tolerance: 0.0009989665248777181
  attention_support: deterministic_fixed_smallest_scores
  lambda_window_months: 24
  lambda_ridge: 0.001
  lambda_estimation: rolling_refit_block_pooled_bounded_lse
  lambda_minimum_history_months: 24
  lambda_held_fixed_within_refit_block: true
  full: true
  reuse_saved_correction: false

# Exploratory GARCH branches use the identical paper-eta convention. The
# HAR--VARA output is included only as a comparator in its metric table.
exploratory_garch_vara:
  entrypoint: scripts/run_datamine_garch_vara.py
  source_output: outputs/datamine_vara/ew_log_risk_full_formula_topk500_exact_lambda24
  output_dir: outputs/datamine_vara/ew_log_risk_garch_vara_papereta_logp_topk500_w240_refit12_lambda24
  har_vara_output: outputs/datamine_vara/ew_log_risk_har_vara_papereta_logp_topk500_w240_refit12_lambda24
  feature_snapshot: snapshot_200712
  component_count: 21800
  error_window_months: 240
  refit_frequency_months: 12
  response_standardization: componentwise_median_mad
  response_clip: 8.0
  ridge: 0.001
  attention_mode: topk
  attention_top_k: 500
  attention_cache_mode: exact
  attention_batch_size: 512
  eta_estimation: ridge_penalized_concentrated_qmle
  eta_parameterization: paper_eta_log_component_count_v1
  eta_score_scale_rule: log_component_count
  eta_score_scale_value: 9.98966524877718
  eta_bounds: [-2.0, 2.0]
  eta_effective_slope_bounds: [-19.97933049755436, 19.97933049755436]
  eta_grid_size: 7
  eta_local_tolerance: 0.0001
  eta_effective_slope_local_tolerance: 0.0009989665248777181
  attention_support: deterministic_fixed_smallest_scores
  lambda_window_months: 24
  lambda_ridge: 0.001
  lambda_estimation: rolling_refit_block_pooled_bounded_lse
  lambda_minimum_history_months: 24
  lambda_held_fixed_within_refit_block: true
  reuse_saved_correction: false

paper_results:
