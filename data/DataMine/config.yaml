# Exploratory fixed-decay RiskMetrics-style EWMA pair. The base recursion uses
# monthly returns directly; only the additive log-risk offset is estimated on
# validation data. VARA is refitted to this base forecast's own genuine errors.
exploratory_riskmetrics_ewma_vara:
  entrypoint: scripts/run_datamine_garch_vara.py
  source_output: outputs/datamine_vara/ew_log_risk_full_formula_topk500_exact_lambda24
  output_dir: outputs/datamine_vara/ew_log_risk_riskmetrics_ewma_vara_papereta_logp_topk500_w240_refit12_lambda24_ray15
  har_vara_output: outputs/datamine_vara/ew_log_risk_har_vara_papereta_logp_topk500_w240_refit12_lambda24
  base_variant: riskmetrics_ewma
  ewma_riskmetrics: true
  ewma_decay: 0.97
  ewma_decay_tuned: false
  observation_frequency: monthly
  conditional_mean: 0.0
  forecast_horizon_months: 1
  variance_recursion: "v[t+1] = 0.97 * v[t] + 0.03 * return[t]^2"
  variance_initialization: first_finite_squared_return_per_series
  missing_return_update: carry_previous_variance_state
  burn_in: full_available_pre_test_history_without_reinitialization
  log_risk_transform: "log(1.0e-6 + v[t+1])"
  log_risk_offset: validation_only_pooled_additive
  vara_response: own_validation_offset_ewma_genuine_forecast_errors
  feature_snapshot: snapshot_200712
  component_count: 21800
  error_window_months: 240
  refit_frequency_months: 12
  response_standardization: componentwise_median_mad
  response_clip: 8.0
  ridge: 0.001
  attention_mode: topk
  attention_top_k: 500
  attention_cache_mode: exact
  attention_batch_size: 512
  parallel_backend: ray
  ray_num_cpus: 15
  max_cpus_per_task: 1
  ray_task_unit: rolling_refit_block
  ray_debug: false
  eta_estimation: ridge_penalized_concentrated_qmle
  eta_parameterization: paper_eta_log_component_count_v1
  eta_score_scale_rule: log_component_count
  eta_score_scale_value: 9.98966524877718
  eta_bounds: [-2.0, 2.0]
  eta_effective_slope_bounds: [-19.97933049755436, 19.97933049755436]
  eta_grid_size: 7
  eta_local_tolerance: 0.0001
  eta_effective_slope_local_tolerance: 0.0009989665248777181
  attention_support: deterministic_fixed_smallest_scores
  lambda_window_months: 24
  lambda_ridge: 0.001
  lambda_estimation: rolling_refit_block_pooled_bounded_lse
  lambda_bounds: [0.0, 1.0]
  lambda_minimum_history_months: 24
  lambda_held_fixed_within_refit_block: true
  model_ids:
    raw: riskmetrics_ewma_raw
    validation_offset: riskmetrics_ewma_validation_offset
    unit_vara: riskmetrics_ewma_vara_unit
    lambda_vara: riskmetrics_ewma_vara_lambda
    raw_unit_vara: riskmetrics_ewma_raw_vara_unit
  forecast_artifacts:
